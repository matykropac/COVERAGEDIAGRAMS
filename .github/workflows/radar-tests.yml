name: Radar regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ssr-validated]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q streamlit_app.py radar_core.py COVERAGEDIAGRAMS.py web_support.py
      - name: Run radar and UI regression tests
        run: python -m pytest -q tests/
