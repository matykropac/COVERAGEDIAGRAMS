name: PAR and runway regression

on:
  push:
    branches:
      - "feature/icao-runways-and-par-comparison-*"
      - "fix/openaip-overpass-provider-recovery-*"
  pull_request:
    paths:
      - "airport_geometry.py"
      - "airspace_geometry.py"
      - "environment_layers.py"
      - "tests/test_provider_recovery.py"
      - "tests/test_airspace_geometry.py"
      - "map_workspace.py"
      - "position_export.py"
      - "tests/test_position_export.py"
      - "radar_core.py"
      - "web_support.py"
      - "tests/test_par_3d_detection.py"
      - "tests/test_par_altitude_reference.py"
      - "assets/persistent_leaflet.js"
      - "tests/test_airport_geometry.py"
      - "tests/test_cached_par_recompute.py"
      - ".github/workflows/airport-par-regression.yml"

jobs:
  runway-par-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal model dependencies
        run: python -m pip install numpy matplotlib pyproj shapely folium branca
      - name: Compile and test runway plus cached PAR model
        run: |
          python -m compileall -q airport_geometry.py map_workspace.py project_file.py
          python -m unittest discover -s tests -p "test_airport_geometry.py" -v
          python -m unittest discover -s tests -p "test_airspace_geometry.py" -v
          python -m unittest discover -s tests -p "test_provider_recovery.py" -v
          python -m unittest discover -s tests -p "test_position_export.py" -v
          python -m unittest discover -s tests -p "test_cached_par_recompute.py" -v
          python -m unittest discover -s tests -p "test_par_altitude_reference.py" -v
          python -m unittest discover -s tests -p "test_par_3d_detection.py" -v
      - name: Check Leaflet module syntax
        run: node --check --input-type=module < assets/persistent_leaflet.js
