name: Build Windows and macOS Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop_launcher.py'
      - 'desktop.spec'
      - 'desktop_smoke.py'
      - 'requirements-desktop.txt'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'desktop-v*'

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: COVERAGEDIAGRAMS-Windows-x64
            binary: dist/COVERAGEDIAGRAMS/COVERAGEDIAGRAMS.exe
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: COVERAGEDIAGRAMS-macOS-arm64
            binary: dist/COVERAGEDIAGRAMS.app/Contents/MacOS/COVERAGEDIAGRAMS
          - name: macOS Intel
            runner: macos-15-intel
            artifact: COVERAGEDIAGRAMS-macOS-x64
            binary: dist/COVERAGEDIAGRAMS.app/Contents/MacOS/COVERAGEDIAGRAMS

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install radar and native desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Compile Python sources
        run: python -m compileall -q desktop_launcher.py desktop_smoke.py streamlit_app.py radar_core.py
      - name: Build desktop bundle
        run: python -m PyInstaller --clean --noconfirm desktop.spec
      - name: Smoke test packaged local Streamlit server
        run: python desktop_smoke.py --binary "${{ matrix.binary }}"
      - name: Create Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/COVERAGEDIAGRAMS -DestinationPath ${{ matrix.artifact }}.zip
      - name: Create macOS application ZIP preserving symlinks
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent dist/COVERAGEDIAGRAMS.app "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30
