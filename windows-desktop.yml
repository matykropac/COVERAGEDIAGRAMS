name: Build Windows Desktop
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r desktop/requirements-windows.txt
      - name: Check Python syntax
        run: python -m compileall -q desktop streamlit_app.py radar_core.py
      - name: Build Windows desktop
        run: python -m PyInstaller --clean --noconfirm desktop/windows.spec
      - name: Package portable application
        shell: pwsh
        run: Compress-Archive -Path dist/COVERAGEDIAGRAMS -DestinationPath COVERAGEDIAGRAMS-Windows-x64.zip
      - name: Upload downloadable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: COVERAGEDIAGRAMS-Windows-x64
          path: COVERAGEDIAGRAMS-Windows-x64.zip
          retention-days: 30
